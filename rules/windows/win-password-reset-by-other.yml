id: win-password-reset-by-other
title: Account Password Reset
status: experimental
severity: MEDIUM
logsource:
  product: windows
  service: security
detection:
  sel:
    event_id: 4724
    action: PASSWORD_RESET
  condition: sel
mitre:
  technique: T1098
  tactic: TA0004
fields: [target_user, user, host]
description: >-
  An attempt was made to reset an account password (EventID 4724). The intent
  is a reset by someone other than the account owner, but a rule can only
  compare a field to a fixed value, not user to target_user, so a self-service
  reset is included. user is who reset it, target_user the account.
falsepositives:
  - Self-service password resets, where user and target_user are the same account
  - Helpdesk resets

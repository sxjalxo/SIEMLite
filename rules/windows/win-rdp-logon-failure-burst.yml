id: win-rdp-logon-failure-burst
title: Failed Remote Desktop Logon Burst From One Source
status: stable
severity: HIGH
logsource:
  product: windows
  service: security
detection:
  sel:
    event_id: 4625
    action: LOGIN_FAIL
    # 10 is RemoteInteractive, the Remote Desktop logon type.
    logon_type: 10
  timeframe: 5m
  count:
    gte: 5
    group_by: [source_ip]
  condition: sel
mitre:
  technique: T1110.001
  tactic: TA0006
fields: [source_ip, target_user, workstation, host]
description: >-
  Five or more failed Remote Desktop logons (EventID 4625, logon type 10) from
  one source address within five minutes, whichever accounts were tried, so
  it also catches password spraying over RDP. Counts only type 10. A server
  that requires Network Level Authentication rejects bad credentials before a
  session exists and logs them as type 3, which this rule does not count:
  win-failed-logon-burst sees those. One alert per burst.
falsepositives:
  - A user with a stale saved password in an RDP client retrying
  - An unrecorded source address. Windows writes the address as "-" on NTLM and Kerberos pass-through failures, so source_ip is "-" and every such failure pools into one window whatever the real origin, across all accounts. Grouping on workstation instead is a site decision
  - A jump host or NAT gateway in front of many users shares one source address
  - Overlaps win-failed-logon-burst when the same failures also meet its threshold
